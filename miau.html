<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gata Celestial - Lofi Experience</title>
    <style>
        :root {
            --sky-blue: #a1c4fd;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000; /* Fondo inicial negro para el splash */
            font-family: 'Courier New', Courier, monospace;
        }

        #escenario {
            position: relative;
            width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Invisible hasta que empiece la música */
            transition: opacity 2s ease;
        }

        /* Capas de nubes */
        .capa-nube {
            position: absolute;
            width: 200%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/clouds.png');
            pointer-events: none;
        }
        .nubes-fondo { opacity: 0.3; animation: scroll 60s linear infinite; z-index: 1; }
        .nubes-frente { opacity: 0.5; filter: blur(3px); animation: scroll 25s linear infinite; z-index: 3; }

        /* La Gata */
        .gata-container {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .gata-img {
            width: 450px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            animation: flotar 4s ease-in-out infinite;
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        /* Botón de Inicio */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            cursor: pointer;
        }

        #btn-play {
            padding: 20px 40px;
            border: 2px solid white;
            background: transparent;
            color: white;
            font-size: 1.5rem;
            border-radius: 50px;
            transition: 0.3s;
        }
        #btn-play:hover { background: white; color: black; }

        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        @keyframes flotar {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-30px) rotate(1deg); }
        }

        /* Ocultar el reproductor de YouTube */
        #player { position: absolute; top: -100px; left: -100px; width: 1px; height: 1px; }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="btn-play">Iniciar Viaje Espacial 🐾</button>
    </div>

    <div id="player"></div>

    <div id="escenario">
        <div class="capa-nube nubes-fondo"></div>
        <div class="gata-container">
            <img src="imagenes/gata.jpg" class="gata-img" id="miGata">
        </div>
        <div class="capa-nube nubes-frente"></div>
    </div>

    <script>
        // Cargar la API de YouTube
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '1',
                width: '1',
                videoId: 'LGs25cx6pU8', // ID de tu video
                playerVars: {
                    'autoplay': 0,
                    'loop': 1,
                    'playlist': 'LGs25cx6pU8'
                }
            });
        }

        const overlay = document.getElementById('overlay');
        const escenario = document.getElementById('escenario');
        const btn = document.getElementById('btn-play');

        btn.addEventListener('click', () => {
            player.playVideo(); // Inicia la música
            overlay.style.display = 'none'; // Quita el botón
            escenario.style.opacity = '1'; // Muestra la animación
        });

        // Efecto Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const gata = document.getElementById('miGata');
            let x = (window.innerWidth / 2 - e.pageX) / 40;
            let y = (window.innerHeight / 2 - e.pageY) / 40;
            gata.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
